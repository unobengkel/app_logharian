{% extends "base.html" %}

{% block title %}{{ 'Edit' if data and data.id_catatan else 'Catat' }} Kegiatan - Catatan Harian{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto animate-in fade-in slide-in-from-bottom-4 duration-500">
    <div class="mb-8 flex items-center gap-4">
        <a href="/catatan" class="w-12 h-12 rounded-2xl bg-white border border-slate-100 flex items-center justify-center shadow-sm hover:bg-slate-50 transition-all">
            <span class="text-xl">⬅️</span>
        </a>
        <div>
            <h1 class="text-3xl font-black text-slate-800 tracking-tight">{{ 'Edit' if data and data.id_catatan else 'Catat' }} Kegiatan</h1>
            <p class="text-slate-500 font-medium">Dokumentasikan progres dan hasil kerja Anda.</p>
        </div>
    </div>

    <div class="bg-white rounded-3xl shadow-xl shadow-slate-200/50 border border-slate-100 overflow-hidden">
        <form action="{{ '/catatan/' + (data.id_catatan|string) + '/update' if data and data.id_catatan else '/catatan' }}" method="POST" class="p-8 lg:p-10 space-y-6">
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Tanggal -->
                <div class="space-y-2">
                    <label for="tanggal" class="block font-bold text-slate-700">Tanggal <span class="text-red-500">*</span></label>
                    <input type="date" id="tanggal" name="tanggal" required 
                           value="{{ data.tanggal if data else '' }}"
                           class="w-full px-5 py-3 rounded-2xl border border-slate-200 focus:ring-4 focus:ring-emerald-500/10 focus:border-emerald-500 transition-all font-medium">
                </div>

                <!-- Kegiatan -->
                <div class="space-y-2">
                    <label for="id_kegiatan" class="block font-bold text-slate-700">Jenis Kegiatan <span class="text-red-500">*</span></label>
                    <select id="id_kegiatan" name="id_kegiatan" required 
                            class="w-full px-5 py-3 rounded-2xl border border-slate-200 focus:ring-4 focus:ring-emerald-500/10 focus:border-emerald-500 transition-all font-medium appearance-none bg-no-repeat bg-[right_1rem_center] bg-[length:1em]">
                        <option value="">Pilih Kegiatan...</option>
                        {% for k in kegiatan %}
                        <option value="{{ k.id_kegiatan }}" {{ 'selected' if data and data.id_kegiatan == k.id_kegiatan else '' }}>{{ k.nama_kegiatan }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Jam Mulai -->
                <div class="space-y-2">
                    <label for="jam_mulai" class="block font-bold text-slate-700">Jam Mulai</label>
                    <input type="time" id="jam_mulai" name="jam_mulai" 
                           value="{{ data.jam_mulai.strftime('%H:%M') if data and data.jam_mulai and not data.jam_mulai is string else (data.jam_mulai if data else '') }}"
                           class="w-full px-5 py-3 rounded-2xl border border-slate-200 focus:ring-4 focus:ring-emerald-500/10 focus:border-emerald-500 transition-all font-medium">
                </div>

                <!-- Jam Selesai -->
                <div class="space-y-2">
                    <label for="jam_selesai" class="block font-bold text-slate-700">Jam Selesai</label>
                    <input type="time" id="jam_selesai" name="jam_selesai" 
                           value="{{ data.jam_selesai.strftime('%H:%M') if data and data.jam_selesai and not data.jam_selesai is string else (data.jam_selesai if data else '') }}"
                           class="w-full px-5 py-3 rounded-2xl border border-slate-200 focus:ring-4 focus:ring-emerald-500/10 focus:border-emerald-500 transition-all font-medium">
                </div>
            </div>

            <!-- Deskripsi -->
            <div class="space-y-2">
                <label for="deskripsi" class="block font-bold text-slate-700">Deskripsi / Hasil Pekerjaan <span class="text-red-500">*</span></label>
                <textarea id="deskripsi" name="deskripsi" rows="6" required
                          placeholder="Ceritakan apa yang sudah Anda kerjakan, kendala yang dihadapi, dan hasil yang dicapai..."
                          class="w-full px-5 py-4 rounded-2xl border border-slate-200 focus:ring-4 focus:ring-emerald-500/10 focus:border-emerald-500 transition-all font-medium resize-none leading-relaxed">{{ data.deskripsi if data else '' }}</textarea>
            </div>

            <!-- Status -->
            <div class="space-y-3">
                <label class="block font-bold text-slate-700">Status Penyelesaian</label>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <label class="cursor-pointer group">
                        <input type="radio" name="status" value="selesai" class="hidden peer" {{ 'checked' if not data or data.status == 'selesai' else '' }}>
                        <div class="py-3 px-4 rounded-xl border-2 border-slate-100 peer-checked:border-emerald-500 peer-checked:bg-emerald-50 transition-all flex items-center justify-center gap-2 font-bold text-slate-400 peer-checked:text-emerald-700">
                            FINISHED
                        </div>
                    </label>
                    <label class="cursor-pointer group">
                        <input type="radio" name="status" value="proses" class="hidden peer" {{ 'checked' if data and data.status == 'proses' else '' }}>
                        <div class="py-3 px-4 rounded-xl border-2 border-slate-100 peer-checked:border-blue-500 peer-checked:bg-blue-50 transition-all flex items-center justify-center gap-2 font-bold text-slate-400 peer-checked:text-blue-700">
                            ON PROGRESS
                        </div>
                    </label>
                    <label class="cursor-pointer group">
                        <input type="radio" name="status" value="tertunda" class="hidden peer" {{ 'checked' if data and data.status == 'tertunda' else '' }}>
                        <div class="py-3 px-4 rounded-xl border-2 border-slate-100 peer-checked:border-slate-500 peer-checked:bg-slate-100 transition-all flex items-center justify-center gap-2 font-bold text-slate-400 peer-checked:text-slate-700">
                            ON HOLD
                        </div>
                    </label>
                </div>
            </div>

            <!-- Submit -->
            <div class="pt-6 flex flex-col sm:flex-row gap-4">
                <button type="submit" class="flex-1 bg-emerald-600 text-white px-8 py-4 rounded-2xl font-black text-lg hover:bg-emerald-700 transition-all shadow-lg shadow-emerald-100 active:scale-95">
                    {{ 'Simpan Perubahan' if data and data.id_catatan else 'Simpan Catatan' }}
                </button>
                <a href="/catatan" class="flex-1 bg-slate-100 text-slate-600 px-8 py-4 rounded-2xl font-bold text-center hover:bg-slate-200 transition-all active:scale-95">
                    Batalkan
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
