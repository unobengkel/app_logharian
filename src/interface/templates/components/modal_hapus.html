<!-- Modal Hapus -->
<div id="modal-hapus" class="fixed inset-0 z-[60] hidden overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
    <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
        <!-- Background overlay -->
        <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm transition-opacity" aria-hidden="true"></div>

        <!-- This element is to trick the browser into centering the modal contents. -->
        <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>

        <div class="inline-block align-bottom bg-white rounded-3xl text-left overflow-hidden shadow-2xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full animate-in zoom-in duration-300">
            <div class="bg-white px-8 pt-8 pb-6">
                <div class="sm:flex sm:items-start">
                    <div class="mx-auto flex-shrink-0 flex items-center justify-center h-16 w-16 rounded-2xl bg-red-50 sm:mx-0 sm:h-14 sm:w-14">
                        <span class="text-3xl">⚠️</span>
                    </div>
                    <div class="mt-4 text-center sm:mt-0 sm:ml-6 sm:text-left">
                        <h3 class="text-2xl font-black text-slate-800 tracking-tight" id="modal-title">Konfirmasi Hapus</h3>
                        <div class="mt-3">
                            <p class="text-slate-500 font-medium">
                                Apakah Anda yakin ingin menghapus <span id="nama-item-hapus" class="text-slate-800 font-bold underline decoration-red-300 decoration-4"></span>? 
                                <br><span class="text-red-500 text-sm font-bold mt-2 block">Tindakan ini tidak dapat dibatalkan.</span>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="bg-slate-50 px-8 py-6 sm:flex sm:flex-row-reverse gap-3">
                <form id="form-hapus" method="POST" class="w-full sm:w-auto">
                    <button type="submit" class="w-full inline-flex justify-center rounded-2xl border border-transparent shadow-lg shadow-red-100 px-8 py-3 bg-red-600 text-white font-bold hover:bg-red-700 transition-all active:scale-95 sm:text-sm">
                        Ya, Hapus Sekarang
                    </button>
                </form>
                <button type="button" onclick="closeModal()" class="mt-3 w-full inline-flex justify-center rounded-2xl border border-slate-200 shadow-sm px-8 py-3 bg-white text-slate-700 font-bold hover:bg-slate-50 transition-all active:scale-95 sm:mt-0 sm:text-sm">
                    Batalkan
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    function confirmHapus(url, nama) {
        document.getElementById('form-hapus').action = url;
        document.getElementById('nama-item-hapus').innerText = nama;
        document.getElementById('modal-hapus').classList.remove('hidden');
    }

    function closeModal() {
        document.getElementById('modal-hapus').classList.add('hidden');
    }
</script>
